ceiling = 1266
owner = "workflow model-tier tests"
reason = "Eval integrity repair (2026-09-16): parent-thinking inheritance, explicit override precedence and absent-readback honesty are covered at the workflow-to-SDK boundary."
trigger = "Above 1266 lines, split executed model/thinking evidence from tier routing."

[[exceptions]]
path = "tests/shared/agent-runtime/agent-sdk-host-evidence.test.ts"
rule = "code-lines"
ceiling = 735
owner = "agent SDK evidence tests"
reason = "Eval integrity repair (2026-09-16): JSONL remains unconditional while HTML rendering is proven disabled by default and enabled only by LOCUS_PI_HTML_TRANSCRIPTS=1."

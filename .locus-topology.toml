reason = "Eval integrity repair (2026-09-16): Package task/plan admission is proven for missing, empty and whitespace input with zero child calls and no published primary file."
trigger = "Above 720 lines, split Package target admission from the generic string/items contract."

[[exceptions]]
path = "tests/extensions/workflows/runtime/workflow-model-tiers.test.ts"

reason = "T-218 W10 (2026-09-12): Fusion declaration/preflight and member+judge execution moved verbatim out of the runtime as one pure composition owner behind injected agent/scheduler ports."
trigger = "Growth above 690 lines: split the declaration/preflight half from the execution half."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-run-finalization.ts"

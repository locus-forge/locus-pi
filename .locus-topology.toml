reason = "T-218 W14 (2026-09-12): the terminal precedence sequence (abort → evidence → handoff → terminal text → lease → report → result.json) moved whole; splitting it would scatter the precedence across two files."
trigger = "Growth above 620 lines: move the RunWorkflowScriptResult declaration to the contract side; never split the sequence."

[[exceptions]]
path = "extensions/_shared/agent-runtime/agent-sdk-host.ts"
rule = "code-lines"
ceiling = 1672
owner = "agent SDK session boundary"
reason = "Eval integrity repair (2026-09-16): the existing child-session boundary now records host thinking readback and gates its adjacent HTML projection without inventing a second session owner."

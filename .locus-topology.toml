schema = "locus.topology.v1"
exclude_paths = [".locus/**", ".tasks/**", ".test_pi/**", ".claude/**", ".pi/**", ".locus-pi/**"]

# Per-file code-line ceilings were removed on 2026-09-12 (T-218 W1). `locus topology check`
# already fails on growth since the base ref, so a ceiling per file only documented
# historical size. Record a new exception only for growth that a reviewer accepted,
# with an owner and a trigger that says when it is revisited.

[[exceptions]]
path = "extensions/_shared/host/pi-api.ts"
rule = "code-lines"
ceiling = 592
owner = "Pi tool result integration"
reason = "T-220: one opt-in registration bridge preserves returned errors through Pi's supported tool_result hook without dropping structured diagnostics. Existing API/type ownership is retained."
trigger = "Any further tool bridge behavior requires review of the host API boundary; do not add more adapters here."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-runtime.ts"
rule = "code-lines"
ceiling = 959
owner = "workflow DSL paths and publication"
reason = "Workflow output separation (2026-09-28): the existing DSL projection now exposes distinct workspaceDir() and outputDir() values while keeping location selection and filesystem policy in the host."
trigger = "Another location primitive must split the path projection from publication instead of growing this composition owner again."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-runner.ts"
rule = "code-lines"
ceiling = 1160
owner = "workflow host composition"
reason = "Workflow output separation (2026-09-28): host composition wires the independently admitted workspace and final-output bindings, leases and result projection without owning their policy."
trigger = "Further location or lease wiring must move a cohesive operation to admission, finalization or the location-state owner instead of enlarging this exception."

[[exceptions]]
path = "tests/extensions/workflows/runtime"
rule = "directory-files"
ceiling = 53
owner = "workflows runtime tests"
reason = "Runtime behavior tests mirror their production owner; T-218 (2026-09-12) added one test file per extracted owner and closed at 53 direct files."
trigger = "T-218 is closed: a 54th file needs its own owner review (a new production owner, or a sub-directory for a stable test family such as replay or return)."

[[exceptions]]
path = "tests/shared/agent-runtime"
rule = "directory-files"
ceiling = 16
owner = "shared agent runtime tests"
reason = "Shared agent runtime tests intentionally mirror the named shared production layer."
trigger = "Split when the directory exceeds 12 direct files or a stable agent-runtime sub-owner gains four tests."

[[exceptions]]
path = "extensions/workflows/runtime"
rule = "directory-files"
ceiling = 44
owner = "workflows runtime"
reason = "T-218 (2026-09-12) extracted single-owner modules (execution state, groups, agent contract/call/attempt/output/model, fusion, journal format, snapshot, workspace, admission, resume, saved child, finalization) out of the runtime/runner/journal/bridge monoliths and closed at 44 direct files."
trigger = "T-218 is closed: a 45th file is a new owner and needs its own review (ledger entry, negative import test) or a sub-directory."

[[exceptions]]
path = "scripts"
rule = "directory-files"
ceiling = 16
owner = "repository gates"
reason = "T-218 W1 (2026-09-12) adds scripts/check-topology.mjs, the size-ratchet entry that check:push runs."
trigger = "A new gate script beyond 16 files needs review; consolidate gate entry points before adding more."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-workspace.ts"
rule = "code-lines"
ceiling = 652
owner = "workflow location identity"
reason = "Workflow output separation (2026-09-28): one confinement owner now resolves typed runtime-workspace and final-output identities with shared symlink and project-boundary proofs."
trigger = "A further final-output policy or a third location kind must move into a separate owner; keep shared confinement and physical identity here."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-workspace-state.ts"
rule = "code-lines"
ceiling = 734
owner = "workflow location state"
reason = "Workflow output separation (2026-09-28): the existing fenced-state owner records independent workspace/output leases and binds checkpoints to both physical identities."
trigger = "Another lease kind or checkpoint schema change must split the shared lease protocol from checkpoint persistence before adding code."

[[exceptions]]
path = "tests/integration/package-boundary.test.ts"
rule = "code-lines"
ceiling = 830
owner = "package boundary contract"
reason = "Package-wide inventory test; each T-218 owner extraction adds a two-line reason next to the packed-file count."
trigger = "Above 830 lines, move the packed-file reason log out of the test body."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-journal-format.ts"
rule = "code-lines"
ceiling = 960
owner = "workflow journal event contract"
reason = "T-218 W4 (2026-09-12): the journal line type, the per-kind field matrix and the strict codec are one versioned contract; splitting types from codec would recreate the two-file read the slice removed."
trigger = "Growth above 960 lines means a new event kind or a second concern; review the event contract before adding code."

[[exceptions]]
path = "scripts/check-extension-layers.ts"
rule = "code-lines"
ceiling = 1000
owner = "architecture ledger"
reason = "AGENTS.md requires one ledger entry per new internal owner, so this file grows by a few lines per T-218 slice by design; the rule engine itself does not grow."
trigger = "Above 1000 lines, move the ledger data (module lists) out of the rule engine into a data file."

